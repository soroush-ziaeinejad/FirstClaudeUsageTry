dataset: cifar10
num_clients: 200
clients_per_round: 20       # 10% participation rate
num_rounds: 100
alpha: 0.5                  # Dirichlet non-IID degree (lower = more heterogeneous)
local_epochs: 1
lr: 0.01
batch_size: 64
data_dir: ./data
mu: 0.01                    # FedProx proximal coefficient
cpus_per_client: 2          # 4 concurrent clients on 8-core; each gets 2 threads = 8 total
gpus_per_client: 0.0        # r7i has no GPU — any value >0 hangs Ray scheduling
torch_num_threads: 2        # intra-op threads per actor; must match cpus_per_client
ray_object_store_mb: 20480  # 20 GB — keeps model params in memory, avoids disk spill
